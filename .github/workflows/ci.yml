name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HUSKY: 0
  NODE_OPTIONS: --no-deprecation

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/ci
      PAYLOAD_SECRET: ci-only-secret-not-for-real-use
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # Repo Actions policy allows only GitHub-owned actions, so pnpm is
      # activated via corepack (bundled with Node) rather than
      # pnpm/action-setup. corepack picks up the `packageManager` pin in
      # package.json automatically.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Integration tests
        run: pnpm run test:int

      - name: Build
        run: pnpm run build
