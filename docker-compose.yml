# Local development stack. Production runs from deploy/docker-compose.production.yml.
services:
  mongo:
    image: mongo:latest
    ports:
      - '127.0.0.1:27017:27017'
    command: ['--storageEngine=wiredTiger']
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    depends_on:
      - mongo
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/aolausoro

volumes:
  mongo-data:
